name: Auto Tweet

on:
  # schedule disabled — all auto-posting paused, redesigning content strategy
  # schedule:
  #   - cron: '0 1 * * *'
  #   - cron: '0 9 * * *'
  #   - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Tweet type'
        required: false
        default: 'educational'
        type: choice
        options:
          - educational
          - signal

permissions:
  contents: write

jobs:
  tweet:
    name: Post Tweet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tsx
        run: npm install -g tsx

      - name: Determine tweet type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type || 'educational' }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "09" ]; then
            echo "type=signal" >> $GITHUB_OUTPUT
          else
            echo "type=educational" >> $GITHUB_OUTPUT
          fi

      - name: Post educational tweet
        if: steps.type.outputs.type == 'educational'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npx tsx scripts/post-tweet.ts

      - name: Post signal tweet
        if: steps.type.outputs.type == 'signal'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npx tsx scripts/post-signal-tweet.ts

      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/tweets-state.json scripts/signal-state.json
          git diff --cached --quiet || git commit -m "Update tweet state [skip ci]"
          git push
