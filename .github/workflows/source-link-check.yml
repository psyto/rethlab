name: Source Link Check

# Runs weekly to detect broken GitHub deep-links in lesson content.
# Opens an issue when one or more links 404 (typically because Reth /
# Revm / Alloy refactored a file out from under us).
#
# Trigger manually with: gh workflow run "Source Link Check"

on:
  schedule:
    # Mondays 09:00 UTC — start of the week, low GitHub API load.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check lesson source links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - id: check
        name: Run link checker
        run: npx tsx .github/scripts/check-source-links.ts | tee /tmp/source-link-report.txt
        continue-on-error: true

      - name: Open issue on failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/source-link-report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const title = `Source-link check failed (${today})`;

            // Avoid spamming: if an issue with the same title already exists, skip.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'source-link-rot',
            });
            if (existing.some((i) => i.title === title)) {
              console.log('Issue already open for today — skipping.');
              return;
            }

            const body = [
              'The weekly source-link check found one or more broken GitHub URLs',
              'in lesson content. Most likely an upstream rename or deletion.',
              '',
              'Full report:',
              '',
              '```',
              report.slice(-5000),
              '```',
              '',
              'Workflow run: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['source-link-rot'],
            });
