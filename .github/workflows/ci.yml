name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Runtime Must Not Read Drafts
        run: npm run check:runtime-no-drafts

      - name: Editorial Style Rules
        run: npm run check:editorial-style

      - name: Generated Seeds Must Be Clean
        run: npm run check:generated-seeds-clean

      - name: Generated Seeds Must Be Clean (EN+JA)
        continue-on-error: true
        run: CONTENT_CHECK_LOCALES=en,ja npm run check:generated-seeds-clean

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/perpu"
      AUTH_SECRET: "ci-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
